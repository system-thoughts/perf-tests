---
apiVersion: batch/v1
kind: Job
metadata:
  name: proxy-bench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app: dragonfly
        component: proxy-bench
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy-bench
          image: ghcr.io/system-thoughts/perf-tests/proxy-bench:replace-with-build-tag
          imagePullPolicy: 'Always'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: '8'
              memory: 16Gi
            limits:
              cpu: '8'
              memory: 16Gi
          # The Vegeta end-of-test report is printed to stdout, read it with
          # kubectl logs job/proxy-bench. The Job fails when at least 1% of
          # the requests failed, the failure rate must be strictly below 1%.
          env:
            # The worker reads the proxy from the standard HTTP_PROXY variable.
            - name: HTTP_PROXY
              value: 'http://seed-client:4001'
            # Mode: "repeat" downloads the same URL every request, "random"
            # appends a unique query string per request, "sequential" reads the
            # object head to tail in CHUNK_SIZE ranges, cycling through a fixed
            # pool of URL_COUNT unique query strings.
            - name: MODE
              value: 'repeat'
            # Target requests per second. PRE_ALLOCATED_VUS and MAX_VUS select
            # Vegeta initial/maximum workers; at the cap it waits for a worker.
            # Read actual request rate in the native report.
            - name: RATE
              value: '1000'
            - name: PRE_ALLOCATED_VUS
              value: '64'
            - name: MAX_VUS
              value: '512'
            - name: DURATION
              value: '60s'
            # Object to download. Defaults to http://file-server/4m (4MiB),
            # or http://file-server/1g (1GiB) in the sequential mode.
            # - name: TARGET_URL
            # value: 'http://file-server/4m'
            # Byte range sent with every request, e.g. "0-1023". Empty means
            # full downloads.
            # - name: RANGE
            # value: ''
            # CPUs the seed client had during the run (its cgroup limit, or what
            # kubectl top / pidstat measured), adds cpu_cost in core/Gbps to the
            # summary. Empty means no CPU cost line.
            # - name: SEED_CLIENT_CPUS
            # value: '4'
