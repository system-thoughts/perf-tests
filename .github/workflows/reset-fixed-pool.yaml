name: Reset legacy fixed-pool GHCR versions once
on:
  push:
    branches: [ci/fixed-pool-delivery]
    paths:
      - .github/workflows/reset-fixed-pool.yaml
      - .github/scripts/reset-fixed-pool.py
permissions:
  contents: read
  packages: write
jobs:
  reset:
    if: github.repository == 'system-thoughts/perf-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reset only the two repository packages, preserving public package settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/reset-fixed-pool.py
      - name: Retain the deletion inventory and result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-pool-ghcr-reset-inventory
          path: reset-evidence/
          if-no-files-found: error
          retention-days: 14
