apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: ${METADATA_NODE}
      securityContext:
        runAsNonRoot: true
        runAsUser: ${DATA_UID}
        runAsGroup: ${DATA_GID}
        fsGroup: ${FS_GROUP}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepare
          image: ${TOOLS_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              job_name=$(printenv JOB_NAME)
              preparation_name=$(printenv PREPARATION_NAME)
              mkdir -p /inputs/reports /inputs/preparations
              set -C
              exec /usr/local/bin/proxy-bench-seed-cache-prepare \
                --manifest /inputs/dataset-manifest.json \
                --target-config /inputs/target-config.yaml \
                --out "/inputs/preparations/$preparation_name" \
                > "/inputs/reports/$job_name.json"
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: PREPARATION_NAME
              value: "${PREPARATION_NAME}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "${PREPARE_CPU_REQUEST}"
              memory: "${PREPARE_MEMORY_REQUEST}"
            limits:
              cpu: "${PREPARE_CPU_LIMIT}"
              memory: "${PREPARE_MEMORY_LIMIT}"
          volumeMounts:
            - name: metadata
              mountPath: /inputs
      volumes:
        - name: metadata
          persistentVolumeClaim:
            claimName: ${METADATA_PVC}
