# Edit source/target here; workers consume the successful preparation record.
# These role names must resolve from the actual callers; use a reachable FQDN/IP/NodePort otherwise.
# This Job is independent of plan.yaml. Use one preparer per output location; existing records are not replaced; the command does not clear Seed cache.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fixed-pool-target
data:
  target-config.yaml: |
    schema_version: 1
    source:
      base_url: http://fixed-pool-source
    target:
      proxy: http://seed-client:4001
      expected_server_ip: 192.0.2.10 # Actual daemon response IP, not proxy DNS/Service IP; replace this example.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fixed-pool-seed
spec:
  backoffLimit: 0
  template:
    spec:
      # Optional placement must respect the metadata PVC topology.
      # nodeSelector: {kubernetes.io/hostname: chosen-node}
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prepare
        image: ghcr.io/system-thoughts/perf-tests/proxy-bench-tools:replace-with-build-tag
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/proxy-bench-prepare
        args:
        - seed-cache
        - --manifest
        - /inputs/dataset-manifest.json
        - --target-config
        - /config/target-config.yaml
        - --out
        - /inputs/preparation
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: inputs
          mountPath: /inputs
        - name: target
          mountPath: /config
          readOnly: true
      volumes:
      - name: inputs
        persistentVolumeClaim:
          claimName: fixed-pool-inputs
      - name: target
        configMap:
          name: fixed-pool-target
