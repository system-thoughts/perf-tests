name: Publish fixed-pool source snapshots
on:
  push:
    branches: [ci/fixed-pool-delivery]
    paths:
      - .github/workflows/deliver-fixed-pool.yaml
      - .github/scripts/deliver-fixed-pool.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'system-thoughts/perf-tests'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Freeze the three latest source commits for this run
        id: sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 control/.github/scripts/deliver-fixed-pool.py resolve
  publish:
    needs: resolve
    if: github.repository == 'system-thoughts/perf-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    concurrency:
      group: fixed-pool-${{ matrix.branch }}-${{ matrix.sha }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_BRANCH: ${{ matrix.branch }}
      SOURCE_SHA: ${{ matrix.sha }}
      LOAD_ENGINE: ${{ matrix.engine }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - name: Checkout publication control only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Checkout the exact unchanged source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}
          path: source
      - name: Verify source and reuse a complete existing delivery
        id: version
        run: python3 control/.github/scripts/deliver-fixed-pool.py preflight
      - name: Set up Go from the source snapshot
        if: steps.version.outputs.complete != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Build the source snapshot's static tools
        if: steps.version.outputs.complete != 'true'
        working-directory: source
        run: make build-proxy-bench-tools
      - name: Set up ARM image construction
        if: steps.version.outputs.complete != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - name: Set up Buildx
        if: steps.version.outputs.complete != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        if: steps.version.outputs.complete != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish preparation tools
        if: steps.version.outputs.complete != 'true' && steps.version.outputs.tools_exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: source
          file: source/${{ matrix.tools_file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/system-thoughts/perf-tests/proxy-bench-tools:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/system-thoughts/perf-tests
            org.opencontainers.image.revision=${{ matrix.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            index:org.opencontainers.image.description=Fixed-pool preparation tools. Tags identify branch and commit; amd64/arm64 suffixes select architecture. Complete deliveries: https://github.com/system-thoughts/perf-tests/releases
      - name: Publish benchmark worker
        if: steps.version.outputs.complete != 'true' && steps.version.outputs.worker_exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: source
          file: source/tools/proxy-bench/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/system-thoughts/perf-tests/proxy-bench:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/system-thoughts/perf-tests
            org.opencontainers.image.revision=${{ matrix.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            index:org.opencontainers.image.description=Benchmark worker. Tags identify branch and commit; amd64/arm64 suffixes select architecture. Use matching preparation tools and deployment files: https://github.com/system-thoughts/perf-tests/releases
      - name: Name both platform manifests and verify their digests
        if: steps.version.outputs.complete != 'true'
        run: python3 control/.github/scripts/deliver-fixed-pool.py aliases
      - name: Archive the matching deployment material as a prerelease
        if: steps.version.outputs.complete != 'true'
        run: python3 control/.github/scripts/deliver-fixed-pool.py publish
      - name: Keep a short-lived copy of the delivery files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-pool-${{ steps.version.outputs.version }}
          path: |
            dist/build-info.txt
            dist/fixed-pool-deploy-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
