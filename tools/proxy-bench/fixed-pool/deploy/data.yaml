# Edit image/node and dataset size/count/source URL. The URL must be reachable from the Seed.
# cluster.local is an example cluster domain. Use one preparer per location; owned output paths must not exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: fixed-pool-data
spec:
  backoffLimit: 0
  template:
    spec:
      # Optional placement must respect the source PVC topology.
      # nodeSelector: {kubernetes.io/hostname: chosen-node}
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: data
        image: ghcr.io/system-thoughts/perf-tests/proxy-bench-tools:replace-with-build-tag
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/proxy-bench-prepare
        args:
        - data
        - --root
        - /data/dataset
        - --size
        - '4194304' # B: bytes per object.
        - --count
        - '2' # N: number of objects.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: inputs
          mountPath: /data
      volumes:
      - name: inputs
        persistentVolumeClaim:
          claimName: fixed-pool-source
