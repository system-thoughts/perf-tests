# Start after the data Job succeeds. Only object bodies are published.
# Recreate the Pod after replacing the mounted dataset directory; RATE/R/W changes do not require it.
apiVersion: v1
kind: Service
metadata:
  name: fixed-pool-source
  namespace: benchmark
spec:
  selector:
    app.kubernetes.io/name: fixed-pool-source
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fixed-pool-source
  namespace: benchmark
spec:
  replicas: 1
  serviceName: fixed-pool-source
  selector:
    matchLabels:
      app.kubernetes.io/name: fixed-pool-source
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fixed-pool-source
    spec:
      nodeSelector:
        kubernetes.io/hostname: source-node
      securityContext:
        fsGroup: 1000
      containers:
      - name: file-server
        image: docker.io/dragonflyoss/file-server@sha256:2ba1179ee4c2634284311cba657b3981482e2061109a8bc1e53597b70a1199d9
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          tcpSocket:
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 512Mi
        volumeMounts:
        - name: source
          mountPath: /usr/share/nginx/html/objects
          subPath: dataset/objects
          readOnly: true
      volumes:
      - name: source
        persistentVolumeClaim:
          claimName: fixed-pool-source
      automountServiceAccountToken: false
