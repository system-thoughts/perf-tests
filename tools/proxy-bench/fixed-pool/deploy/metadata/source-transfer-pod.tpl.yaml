apiVersion: v1
kind: Pod
metadata:
  name: ${TRANSFER_POD_NAME}
  namespace: ${NAMESPACE}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: ${SOURCE_NODE}
  securityContext:
    runAsNonRoot: true
    runAsUser: ${DATA_UID}
    runAsGroup: ${DATA_GID}
    fsGroup: ${FS_GROUP}
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: transfer
      image: ${TOOLS_IMAGE}
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec", "exec sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: files
          mountPath: /data
          readOnly: true
  volumes:
    - name: files
      persistentVolumeClaim:
        claimName: ${PVC_NAME}
        readOnly: true
